<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - SkillSync AI</title>

    <link rel="stylesheet" href="student.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<script src="student.js"></script>
<body>

<div class="form-container">

    <h1>Student Registration</h1>

    <form id="studentForm">

        <input type="text" placeholder="Full Name" required>

        <input type="email" placeholder="Email Address" required>

        <input type="tel" placeholder="Phone Number" required>

        <select required>
            <option value="">Select Department</option>
            <option>Mechatronics Engineering</option>
            <option>Computer Science Engineering</option>
            <option>Information Technology</option>
            <option>Artificial Intelligence & Data Science</option>
            <option>Artificial Intelligence & Machine Learning</option>
            <option>Electronics & Communication Engineering</option>
            <option>Electrical & Electronics Engineering</option>
            <option>Mechanical Engineering</option>
            <option>Civil Engineering</option>
            <option>Automobile Engineering</option>
            <option>Biomedical Engineering</option>
            <option>Aeronautical Engineering</option>
            <option>Aerospace Engineering</option>
            <option>Chemical Engineering</option>
            <option>Robotics & Automation</option>
        </select>

        <select required>
            <option value="">Select Year</option>
            <option>1st Year</option>
            <option>2nd Year</option>
            <option>3rd Year</option>
            <option>4th Year</option>
        </select>

        <textarea placeholder="Enter Your Skills (Python, CAD, Robotics, IoT, PLC, MATLAB etc.)"></textarea>

        <input type="file">

        <button type="submit">Register</button>

    </form>

</div>

</body>
</html>
